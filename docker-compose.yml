# Solo para probar la imagen en local ANTES de subir a Kubernetes:
#   docker compose up --build
# Backend en http://localhost:8000  (health: /api/health/)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: pander_db
      POSTGRES_USER: pander
      POSTGRES_PASSWORD: pander_local
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pander -d pander_db"]
      interval: 5s
      retries: 10

  backend:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: clave-local-de-prueba
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_SSL_REDIRECT: "False"
      DB_NAME: pander_db
      DB_USER: pander
      DB_PASSWORD: pander_local
      DB_HOST: db
      FRONTEND_URL: http://localhost:8080
      CORS_ALLOWED_ORIGINS: http://localhost:8080
    command: sh -c "python manage.py migrate && exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --timeout 300"
    ports:
      - "8000:8000"

volumes:
  pgdata:
