# Configuración NO secreta. Las claves (SECRET_KEY, contraseñas) van en el Secret "pander-secrets",
# que se crea a mano con kubectl (ver DESPLIEGUE_KUBERNETES.md, paso 7).
apiVersion: v1
kind: ConfigMap
metadata:
  name: pander-config
  namespace: pander
data:
  DJANGO_DEBUG: "False"
  DJANGO_ALLOWED_HOSTS: "pander.duckdns.org"
  DJANGO_SSL_REDIRECT: "True"
  # Subir a 31536000 (1 año) cuando HTTPS ya funcione bien en producción
  DJANGO_HSTS_SECONDS: "0"
  CSRF_TRUSTED_ORIGINS: "https://pander.duckdns.org"
  CORS_ALLOWED_ORIGINS: "https://pander.duckdns.org"
  FRONTEND_URL: "https://pander.duckdns.org"
  DB_NAME: "pander_db"
  DB_USER: "pander"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  MEDIA_ROOT: "/app/media"
  GUNICORN_WORKERS: "2"
  GUNICORN_THREADS: "4"
  GUNICORN_TIMEOUT: "300"
  EMAIL_HOST: "smtp.gmail.com"
  EMAIL_PORT: "587"
  EMAIL_USE_TLS: "True"
  DEFAULT_FROM_EMAIL: "Pander Notificaciones <no-reply@pander.duckdns.org>"
