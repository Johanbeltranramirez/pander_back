name: Desplegar backend

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/johanbeltranramirez/pander-back   # GHCR exige minúsculas

jobs:
  build:
    # Runner ARM nativo (gratis en repos públicos): evita emular ARM con QEMU, que es lentísimo con torch
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Poner el SHA del commit como tag de la imagen en los manifiestos
        run: sed -i "s|pander-back:latest|pander-back:${GITHUB_SHA}|g" kubernetes/04-backend.yaml kubernetes/04-migrations.yaml

      - name: Preparar SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Copiar manifiestos al servidor
        run: |
          ssh -i ~/.ssh/id_deploy ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "mkdir -p ~/pander/kubernetes"
          scp -i ~/.ssh/id_deploy kubernetes/*.yaml ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/pander/kubernetes/

      - name: Aplicar en el clúster
        run: |
          ssh -i ~/.ssh/id_deploy ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} 'bash -s' <<'REMOTE'
          set -euo pipefail
          K="sudo k3s kubectl"
          cd ~/pander/kubernetes

          $K apply -f 00-namespace.yaml
          # El Secret se crea a mano una sola vez; sin él nada arranca
          $K -n pander get secret pander-secrets >/dev/null

          $K apply -f 01-configmap.yaml -f 03-media-pvc.yaml -f 03-postgres.yaml
          $K -n pander rollout status statefulset/postgres --timeout=300s

          # Los Jobs no se pueden modificar: se borra el anterior y se crea uno nuevo con la imagen nueva
          $K -n pander delete job pander-migrate --ignore-not-found
          $K apply -f 04-migrations.yaml
          $K -n pander wait --for=condition=complete job/pander-migrate --timeout=600s

          $K apply -f 04-backend.yaml -f 07-hpa.yaml -f 06-ingress.yaml
          $K -n pander rollout status deployment/backend --timeout=600s
          REMOTE
